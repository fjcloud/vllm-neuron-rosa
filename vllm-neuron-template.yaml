apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: vllm-neuron-inference
  annotations:
    description: "Deploy a pre-compiled LLM on AWS Inferentia2 using vLLM + Neuron"
    tags: "ai,inference,neuron,vllm"
objects:

# --- PVC for HF cache (model download + compiled artifacts) ---
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: "${APP_NAME}-cache"
    labels:
      app: "${APP_NAME}"
  spec:
    accessModes: [ReadWriteOnce]
    storageClassName: "${STORAGE_CLASS}"
    resources:
      requests:
        storage: "${PVC_SIZE}"

# --- Deployment ---
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: "${APP_NAME}"
    labels:
      app: "${APP_NAME}"
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: "${APP_NAME}"
    template:
      metadata:
        labels:
          app: "${APP_NAME}"
      spec:
        schedulerName: neuron-scheduler
        nodeSelector:
          node.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
        containers:
        - name: vllm
          image: "${VLLM_IMAGE}"
          args:
          - "--max-model-len"
          - "${MAX_MODEL_LEN}"
          - "--tensor-parallel-size"
          - "${TP_SIZE}"
          - "--max-num-seqs"
          - "${MAX_NUM_SEQS}"
          - "--block-size"
          - "32"
          - "--num-gpu-blocks-override"
          - "${MAX_NUM_SEQS}"
          - "--no-enable-prefix-caching"
          - "--additional-config"
          - '{"override_neuron_config": {"save_sharded_checkpoint": true}}'
          env:
          - name: HF_MODEL_ID
            value: "${HF_MODEL_ID}"
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: "${HF_SECRET_NAME}"
                key: token
          - name: HF_HOME
            value: /cache
          - name: HF_HUB_DISABLE_XET
            value: "1"
          - name: VLLM_USE_V1
            value: "1"
          - name: VLLM_NO_USAGE_STATS
            value: "1"
          - name: NEURON_CC_FLAGS
            value: "--auto-cast=matmul --auto-cast-type=bf16 -O1"
          ports:
          - containerPort: 8000
            protocol: TCP
          volumeMounts:
          - name: cache-vol
            mountPath: /cache
          resources:
            requests:
              aws.amazon.com/neuron: "1"
              memory: "${MEMORY_REQUEST}"
            limits:
              aws.amazon.com/neuron: "1"
              memory: "${MEMORY_LIMIT}"
        volumes:
        - name: cache-vol
          persistentVolumeClaim:
            claimName: "${APP_NAME}-cache"

# --- Service ---
- apiVersion: v1
  kind: Service
  metadata:
    name: "${APP_NAME}"
    labels:
      app: "${APP_NAME}"
  spec:
    selector:
      app: "${APP_NAME}"
    ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

# --- Route (edge TLS + extended timeout) ---
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: "${APP_NAME}"
    labels:
      app: "${APP_NAME}"
    annotations:
      haproxy.router.openshift.io/timeout: "300s"
  spec:
    to:
      kind: Service
      name: "${APP_NAME}"
    port:
      targetPort: 8000
    tls:
      termination: edge

parameters:
- name: APP_NAME
  description: "Name for all created resources"
  value: "mistral-neuron"
- name: VLLM_IMAGE
  description: "vLLM Neuron container image"
  value: "image-registry.openshift-image-registry.svc:5000/neuron-inference/vllm-neuron@sha256:a47f862453789c3ea078b509243174021f09fab17e31e75b08f2ef41cdc4b562"
- name: HF_MODEL_ID
  description: "HuggingFace model repo (must contain neuron-compiled-artifacts/ subfolder)"
  value: "fjcloud/Mistral-7B-Instruct-v0.3-neuron-inf2-tp2"
- name: HF_SECRET_NAME
  description: "Name of the Secret containing the HF token (key: token)"
  value: "hf-token"
- name: INSTANCE_TYPE
  description: "AWS Inferentia2 instance type"
  value: "inf2.xlarge"
- name: TP_SIZE
  description: "Tensor parallel size (number of NeuronCores)"
  value: "2"
- name: MAX_MODEL_LEN
  description: "Maximum sequence length"
  value: "4096"
- name: MAX_NUM_SEQS
  description: "Maximum concurrent sequences"
  value: "4"
- name: MEMORY_REQUEST
  description: "Memory request for the container"
  value: "6Gi"
- name: MEMORY_LIMIT
  description: "Memory limit for the container"
  value: "14Gi"
- name: PVC_SIZE
  description: "Size of the model cache PVC"
  value: "50Gi"
- name: STORAGE_CLASS
  description: "StorageClass for the PVC"
  value: "gp3-csi"
