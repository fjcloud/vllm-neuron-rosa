apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: aws-neuron-rule
spec:
  rules:
    - name: "aws-neuron-device"
      labels:
        "feature.node.kubernetes.io/aws-neuron": "true"
      matchFeatures:
        - feature: pci.device
          matchExpressions:
            vendor:
              op: In
              value: ["1d0f"]
            device:
              op: In
              value: ["7064"]
